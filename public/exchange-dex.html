<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchange | BRO Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/deployment-ft.css">
  <link rel="stylesheet" href="/styles/deployment-dex.css">
</head>

<body>
  <header>
    <a href="/">
      <img src="https://www.brobuilder.llc/images/logo2.png" alt="BRO Builder LLC">
    </a>
    <div class="tag">Web3 Portal</div>
  </header>

  <main>
    <h1>Token &harr; XTZ Exchange</h1>
    <p class="sub">Swap XTZ and an FA2 token against a constant-product DEX pool.</p>

    <fieldset>
      <legend>1. Network</legend>
      <label for="network">Network</label>
      <select id="network">
        <option value="shadownet" selected>ShadowNet (testnet)</option>
        <option value="ghostnet">Ghostnet (testnet)</option>
        <option value="mainnet">Mainnet</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>2. Wallet</legend>
      <div class="row">
        <button id="connectBtn">Connect Wallet</button>
        <button id="disconnectBtn" class="secondary" style="display:none;">Disconnect</button>
      </div>
      <div id="walletInfo"></div>
    </fieldset>

    <fieldset>
      <legend>3. DEX Pool</legend>
      <label for="dexAddress">DEX contract address</label>
      <input type="text" id="dexAddress" placeholder="KT1..." autocomplete="off" spellcheck="false">
      <div class="row" style="margin-top:10px;">
        <button id="loadDexBtn" class="secondary" type="button">Load Pool</button>
      </div>
      <div id="poolInfo" class="info"></div>
    </fieldset>

    <fieldset>
      <legend>4. Swap</legend>
      <label for="amountIn" id="labelIn">You pay</label>
      <input type="text" id="amountIn" inputmode="decimal" placeholder="0.0" autocomplete="off" disabled>

      <div class="row" style="margin:12px 0 0;">
        <button id="flipBtn" class="secondary" type="button" disabled>&#8645; Flip direction</button>
      </div>

      <label for="amountOut" id="labelOut">You receive (estimated)</label>
      <input type="text" id="amountOut" placeholder="0.0" readonly>

      <label for="slippage">Slippage tolerance (%)</label>
      <input type="number" id="slippage" value="0.5" min="0" max="50" step="0.1">

      <div id="quoteInfo" class="info"></div>

      <div id="operatorRow" style="display:none;">
        <label style="display:flex; gap:8px; align-items:center; font-weight:500;">
          <input type="checkbox" id="authorizeCheck" checked style="width:auto;">
          Authorize the DEX as operator in the same transaction
        </label>
        <p class="hint">Required once so the DEX can pull your tokens. Untick it if you already authorized it.</p>
      </div>

      <button id="swapBtn" class="deploy" style="margin-top:16px;" disabled>Swap</button>
    </fieldset>

    <h3>Status</h3>
    <div id="status">Idle.</div>
  </main>

  <footer>
    BRO Builder LLC &mdash; tools for internal / partner use.
  </footer>

  <script src="/dist/exchange-dex.umd.js"></script>
</body>
</html>
